# ─────────────────────────────────────────────────────────────
#  Automated Trading Agents — Configuration
# ─────────────────────────────────────────────────────────────
#  Copy this file to config.yaml and adjust values as needed.
#  All parameters here can also be overridden via CLI flags or
#  environment variables (env vars take highest precedence).
# ─────────────────────────────────────────────────────────────

# Alpaca API (override via .env or env vars)
alpaca:
  base_url: "https://paper-api.alpaca.markets"

# General
trading:
  mode: paper
  default_symbols:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - TSLA
  timeframe: 1Day            # 1Min, 5Min, 15Min, 1Hour, 1Day

# Technical Analysis Agent
technical_analysis:
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2
  ema_short: 9
  ema_long: 21
  stochastic_period: 14
  stochastic_smooth: 3
  stochastic_oversold: 20
  stochastic_overbought: 80
  adx_period: 14
  adx_trend_threshold: 25    # ADX > 25 = trending market
  buy_threshold: 2
  sell_threshold: -2

# Multi-Timeframe Analysis
multi_timeframe:
  enabled: false              # Set to true to use multi-timeframe mode
  timeframes:                 # List of timeframes to analyze (order = priority)
    - 1Day
    - 1Hour
  agreement_mode: unanimous   # unanimous, majority, or weighted
  min_agreement: 0.5          # For majority mode: minimum ratio to trigger signal

# Sentiment Analysis Agent
sentiment_analysis:
  news_limit: 20
  lookback_days: 7
  bullish_threshold: 0.15
  bearish_threshold: -0.15
  decay_half_life_hours: 48

# Risk Management Agent
risk_management:
  max_position_pct: 0.10     # Max 10% of equity in one stock
  max_portfolio_exposure: 0.90  # Max 90% of equity deployed
  risk_per_trade_pct: 0.02   # Risk 2% of equity per trade
  atr_stop_multiplier: 1.5
  take_profit_ratio: 2.0     # 2:1 reward-to-risk

# Portfolio Manager
portfolio_manager:
  ta_weight: 0.65
  sentiment_weight: 0.35
  buy_threshold: 0.25
  sell_threshold: -0.25

# Execution Agent
execution:
  max_retries: 2
  retry_delay: 1.0            # seconds between retries
  fill_check_delay: 1.0       # seconds before checking fill
  fill_check_attempts: 3

# Scheduler
scheduler:
  interval_minutes: 15
  no_wait: false

# Backtesting
backtest:
  initial_capital: 100000
  days: 365

# Watchlist Scanner
scanner:
  default_source: SP500_TOP50   # SP500_TOP50, NASDAQ100_TOP50, POPULAR_TECH, HIGH_DIVIDEND, ETFS, or CSV path
  top_n: 10                     # Number of top candidates to show
  signal_filter: all            # all, buy, or sell
  min_score: 2                  # Minimum absolute score to include
  rate_limit_delay: 0.1         # Seconds between API calls (avoid throttling)

# Trailing Stop Manager
trailing_stops:
  enabled: true                 # Enable trailing stop management
  default_mode: percentage      # percentage, atr, fixed, or stepped
  trail_percentage: 5.0         # For percentage mode: trail by X%
  trail_atr_multiplier: 2.0     # For ATR mode: trail by X * ATR
  trail_fixed_amount: 5.0       # For fixed mode: trail by $X
  step_threshold: 2.0           # For stepped mode: min % move to trigger update
  auto_sync: true               # Sync with broker positions on startup
  persist_state: true           # Save state to file for recovery

# Unified Trading Pipeline
pipeline:
  enable_regime: true             # Include market regime detection
  enable_correlation: true        # Check correlation before new positions
  enable_trailing_stops: true     # Register trailing stops for new fills
  enable_events: true             # Publish events to the event bus
  enable_journal: true            # Log signals, decisions, and orders
  enable_notifications: true      # Send notifications on signals/orders

# Correlation Filter
correlation:
  enabled: true                 # Enable correlation filtering
  threshold: 0.70               # Correlation coefficient threshold (0.0-1.0)
  lookback_days: 90             # Days of historical data for correlation calc
  use_sector_groups: true       # Use pre-defined sector groups for quick checks
  cache_ttl_minutes: 60         # Cache correlation calculations

# Position Sizer (Kelly Criterion)
position_sizer:
  kelly_factor: 0.5               # Fraction of Kelly to use (0.5 = half-Kelly)
  max_position_pct: 0.10          # Max single position as % of equity
  max_portfolio_heat: 0.06        # Max total risk across all positions (%)
  atr_risk_multiplier: 1.5        # Stop distance = ATR * multiplier
  take_profit_ratio: 2.0          # Reward-to-risk ratio
  default_win_rate: 0.50          # Assumed win rate when unknown
  default_payoff_ratio: 1.5       # Assumed avg_win/avg_loss when unknown
  vol_target: 0.15                # Target annual volatility for vol-scaling

# Signal Aggregator
aggregator:
  ta_weight: 0.40
  sentiment_weight: 0.20
  mtf_weight: 0.30
  regime_weight: 0.10
  buy_threshold: 0.25
  sell_threshold: -0.25
  min_sources: 1                    # Minimum signal sources required
  regime_adaptive: true             # Adjust weights based on market regime
  agreement_bonus: 0.10             # Confidence bonus for unanimous agreement

# Market Regime Detector
regime:
  adx_trend_threshold: 25.0     # ADX above this = trending
  vol_high_threshold: 0.30      # Annualised vol above 30% = high volatility
  bb_squeeze_percentile: 20.0   # BB width in bottom 20% = squeeze
  ema_short_period: 9
  ema_long_period: 50
  vol_lookback: 20              # Days for volatility calculation
  slope_lookback: 5             # Bars for slope calculation

# Event Bus
event_bus:
  enabled: true                   # Enable event bus for inter-component communication
  strict_mode: false              # If true, only allow well-known event types
  max_history: 100                # Number of recent events to retain
  log_events: false               # Log all events to console

# Logging
logging:
  level: INFO                # DEBUG, INFO, WARNING, ERROR

# Notifications
notifications:
  # Filter settings
  enabled_events:            # Which events trigger notifications
    - signal
    - order_placed
    - order_filled
    - order_failed
  min_signal_score: 0.25     # Only notify for signals >= this threshold

  # Email (SMTP) — credentials via env vars: SMTP_USER, SMTP_PASSWORD
  email:
    enabled: false
    smtp_host: smtp.gmail.com
    smtp_port: 587
    from_address: ""
    to_addresses: []         # List of recipient emails

  # Slack — webhook URL via env var: SLACK_WEBHOOK_URL
  slack:
    enabled: false

  # Discord — webhook URL via env var: DISCORD_WEBHOOK_URL
  discord:
    enabled: false

  # Generic webhook — URL via env var: NOTIFY_WEBHOOK_URL
  webhook:
    enabled: false
